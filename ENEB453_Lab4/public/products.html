<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products – ShopNest</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       NAVIGATION
  ═══════════════════════════════════════════════ -->
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">Shop<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html" class="active">Products</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
      <div class="nav-actions">
        <button class="cart-btn" onclick="window.location.href='orders.html'">
          🛒 <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- ═══════════════════════════════════════════════
       PAGE HEADER
  ═══════════════════════════════════════════════ -->
  <section class="page-hero">
    <h1>All Products</h1>
    <p>Browse our full catalog. Add items to your cart or manage inventory below.</p>
  </section>

  <main class="main-content">

    <!-- ─────────────────────────────────────────────
         SEARCH + FILTER BAR
         TODO (Lab 4): Wire the search input to call
         GET /api/products?search=<term> on keyup.
    ───────────────────────────────────────────── -->
    <div class="toolbar">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search products…"
        oninput="handleSearch(this.value)"
      />
      <span class="product-count" id="productCount">Showing 3 products</span>
    </div>

    <!-- ─────────────────────────────────────────────
         PRODUCT GRID
         TODO (Lab 4): On page load, call
         loadProducts() which fetches GET /api/products
         and renders cards into #product-list.
    ───────────────────────────────────────────── -->
    <div class="product-grid" id="product-list">
      <!-- Products are rendered by product_app.js -->
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Loading products…</p>
      </div>
    </div>

    <!-- ─────────────────────────────────────────────
         ADMIN PANEL – Add / Edit Product
         TODO (Lab 4): On "Add Product" click, send
         a POST /api/products request.
         On "Save Changes" click (edit mode), send
         a PUT /api/products/:id request.
    ───────────────────────────────────────────── -->
    <section class="admin-panel">
      <h2 id="formTitle">➕ Add New Product</h2>

      <form class="product-form" id="productForm" onsubmit="handleProductSubmit(event)">

        <!-- Hidden: used when editing an existing product -->
        <input type="hidden" id="editProductId" value="" />

        <div class="form-row">
          <div class="form-group">
            <label for="productName">Product Name <span class="required">*</span></label>
            <input type="text" id="productName" placeholder="e.g. Mechanical Keyboard" required />
          </div>
          <div class="form-group">
            <label for="productPrice">Price ($) <span class="required">*</span></label>
            <input type="number" id="productPrice" placeholder="0.00" step="0.01" min="0" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="productStock">Stock Quantity</label>
            <input type="number" id="productStock" placeholder="0" min="0" />
          </div>
        </div>

        <div class="form-group">
          <label for="productDesc">Description</label>
          <textarea id="productDesc" rows="3" placeholder="Short product description…"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Product</button>
          <button type="button" class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
        </div>

        <!-- Error / success message area -->
        <div class="form-message" id="formMessage"></div>
      </form>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-logo">Shop<span>Nest</span></p>
      <p class="footer-copy">ENEB453 – Web-Based Application Development · Reference Project</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="product_app.js"></script>
</body>
</html>
