<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – ShopNest</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       NAVIGATION
  ═══════════════════════════════════════════════ -->
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">Shop<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="signup.html" class="active">Sign Up</a></li>
      </ul>
      <div class="nav-actions">
        <button class="cart-btn" onclick="window.location.href='orders.html'">
          🛒 <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- ═══════════════════════════════════════════════
       SIGN UP SECTION
  ═══════════════════════════════════════════════ -->
  <section class="auth-section">
    <div class="auth-card">

      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join ShopNest and start shopping today.</p>
      </div>

      <!-- ─────────────────────────────────────────────
           REGISTRATION FORM
           TODO (Lab 4): On submit, POST the form data
           to /api/customers as JSON.
           On success (201), show the assigned
           customer_id and redirect to index.html.
           On duplicate email (409 / ER_DUP_ENTRY),
           display "This email is already registered."
      ───────────────────────────────────────────── -->
      <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)" novalidate>

        <div class="form-group">
          <label for="signupName">Full Name <span class="required">*</span></label>
          <input
            type="text"
            id="signupName"
            placeholder="Alice Johnson"
            required
            minlength="2"
          />
          <span class="field-error" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address <span class="required">*</span></label>
          <input
            type="email"
            id="signupEmail"
            placeholder="alice@example.com"
            required
          />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="signupPhone">Phone Number</label>
          <input
            type="tel"
            id="signupPhone"
            placeholder="555-1234"
          />
        </div>

        <div class="form-group">
          <label for="signupAddress">Delivery Address</label>
          <textarea
            id="signupAddress"
            rows="2"
            placeholder="123 Maple St, College Park, MD 20742"
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="signupBtn">
          Create Account
        </button>

        <div class="form-message" id="signupMessage"></div>

      </form>

      <!-- ─────────────────────────────────────────────
           CUSTOMER LIST (Admin / Debug view)
           TODO (Lab 4): Fetch GET /api/customers and
           render the table rows in #customer-tbody.
           Add a Delete button per row that calls
           DELETE /api/customers/:id.
      ───────────────────────────────────────────── -->
      <details class="customer-debug">
        <summary>🔧 Admin: View All Customers</summary>
        <div class="table-wrap" style="margin-top:1rem;">
          <table class="orders-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customer-tbody">
              <!-- TODO (Lab 4): Rows injected by signup_app.js -->
              <tr>
                <td colspan="6" class="empty-state">
                  <button class="btn btn-sm btn-outline" onclick="loadCustomers()">Load Customers</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </details>

    </div>
  </section>

  <!-- ═══════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-logo">Shop<span>Nest</span></p>
      <p class="footer-copy">ENEB453 – Web-Based Application Development · Reference Project</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="signup_app.js"></script>
</body>
</html>
